# Sample: six empty none_found without checked lists (must FAIL)
tier_declaration:
  host: opencode
  adapter: opencode-sequential
  tier: T2
  execution_mode: sequential
  passes_completed:
    - code-correctness
    - silent-failures
    - tests
    - types
    - comments
    - simplify
  passes_skipped: []
  capabilities:
    agent_suite: false
    external_bots: []
    clawpatch: false
    issue_tracker: none
  gate_status: Pass

passes:
